[LLM]
model = qwen-plus
api_key =YOUR_DASHSCOPE_API_KEY_HERE
api_base = https://dashscope.aliyuncs.com/compatible-mode/v1
temperature = 0.2

; DeepSeek模型名称:
; - deepseek-chat (标准聊天模型，推荐)
; - deepseek-reasoner (推理模型，如果可用)


; For Alibaba Cloud DashScope Qwen models, use the compatible mode endpoint
; Get your API key from: https://dashscope.aliyun.com/
; For openai online LLMs, the default api_base is https://api.openai.com/v1/
; For local LLMs, the api_base is usually like http://ip:port/v1/

; Recommended models for better performance (二角色模式推荐):
; - qwen-max (阿里云通义千问最强模型)
; - qwen-plus (阿里云通义千问增强版)
; - gpt-4 (OpenAI GPT-4)
; - gpt-4-turbo (OpenAI GPT-4 Turbo)
; - claude-3-opus (Anthropic Claude 3 Opus)